[package]
name = "pacto"
default-run = "pacto"
version = "0.6.1"
description = "A Tauri App"
authors = ["daopunk"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
# Adds the OS trust store to the relay websocket's root set so a debug build
# can reach a locally-issued `wss://` relay. Never in `default`: cargo cannot
# gate a dependency feature on `debug_assertions`, so enabling it here would
# widen release relay trust to every CA the host trusts.
local-relay-tls = ["dep:tokio-tungstenite"]
# Relay-free seeding harness (`src/bin/relay_free_harness.rs`). Never in
# `default` and never linked into a release build -- it exists purely to
# drive the library crate's real ingest path from a headless CI job.
relay-free-harness = []

[[bin]]
name = "relay-free-harness"
path = "src/bin/relay_free_harness.rs"
required-features = ["relay-free-harness"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pacto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
nostr-sdk = { version = "0.44.1", features = ["nip06", "nip44", "nip59"] }
nostr-blossom = "0.44.0"
# mdk-* 0.8.0 is the final release of this API; MDK v0.9.x replaced these crates
# with the unpublished cgka-engine workspace. See docs/mls/ARCHITECTURE.md.
mdk-core = "0.8.0"
mdk-sqlite-storage = "0.8.0"
mdk-storage-traits = "0.8.0"
bip39 = { version = "2.2.0", features = ["rand"] }
tokio = { version = "1.48.0", features = ["sync", "time", "net"] }
futures-util = "0.3.31"
tauri = { version = "2.9.1", features = ["protocol-asset", "image-png", "test"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12.24", features = ["rustls-tls", "stream", "blocking", "multipart"] }
scraper = "0.24.0"
aes = "0.8.4"
aes-gcm = "0.10.3"
hex = "0.4.3"
generic-array = "0.14.7"
digest = "0.10"
sha2 = "0.10.9"
k256 = { version = "0.13", features = ["ecdsa"] }
secp256k1 = { version = "0.29", features = ["std", "recovery"] }
sha3 = "0.10"
once_cell = "1.21.3"
lazy_static = "1.5.0"
dotenvy = "0.15.7"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"
tauri-plugin-opener = "2.5.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-deep-link = "2.4.5"
parking_lot = "0.12"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "ico"] }
infer = "0.19"
blurhash = "0.2.3"
base64 = "0.22.1"
cpal = "0.16.0"
hound = "3.5.1"
rubato = "0.16.2"
symphonia = { version = "0.5.5", features = ["mp3", "wav", "flac", "pcm"] }
# Cargo unifies this with mdk-sqlite-storage's `bundled-sqlcipher` to the SQLCipher
# variant. The vendored-openssl superset drops the system-OpenSSL and Windows-Perl
# requirements that plain `bundled-sqlcipher` carries. Unkeyed databases open as
# stock SQLite, so existing `pacto.db` files are unaffected.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
refinery = { version = "0.9", features = ["rusqlite", "int8-versions"] }
# Same hasher refinery-core uses for migration checksums (SipHasher13).
# Direct dependency so storage_format::legacy_i32_checksum can reproduce a
# pre-int8-versions build's checksum for recognition, without depending on
# refinery-core's private internals.
siphasher = "1"
log = "0.4"
rand = "0.8"
url = "2.5"
# Use alloy 1.x: 0.15.x `alloy-consensus` does not build against serde 1.0.228+.
# `reqwest` + `reqwest-rustls-tls` enable the JSON-RPC HTTP client (default-features = false drops them otherwise → "No transports enabled").
alloy = { version = "1.0.41", default-features = false, features = ["provider-http", "signer-local", "sol-types", "rpc-types", "contract", "reqwest", "reqwest-rustls-tls"] }
alloy-rlp = "0.3"
time = "0.3"
rustls = "0.23"
# Not called from our code. Present only so cargo's feature unification adds
# `rustls-tls-native-roots` to the `tokio-tungstenite` that nostr-sdk pulls in
# via async-wsocket, which pins `rustls-tls-webpki-roots` and exposes no
# feature of its own to change it. The root store is built additively, so the
# OS store is consulted alongside the compiled-in Mozilla roots rather than
# replacing them. Version must track async-wsocket's to stay one instance.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"], optional = true }
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "std"] }
# Reaches `tokio_tungstenite::tungstenite::Error` inside async-wsocket's `Ws` variant for a
# typed downcast (see `classify_relay_error` in src/lib.rs). Version must track what
# nostr-sdk pulls via async-wsocket's own `tokio-tungstenite` pin.
async-wsocket = "0.13.2"
# Must stay pinned to "0.26": a second, non-unified 0.28.0 also resolves in the lockfile,
# and a looser pin here would silently break the downcast above.
tungstenite = "0.26"
# default-features = false: defaults are empty and the optional `ring`/`verify`
# crypto features are never enabled -- only the leaf DER is parsed, no signature
# is verified. See docs/plans/2026-08-14-001-feat-relay-diagnostics-plan.md (KTD4).
x509-parser = { version = "0.18", default-features = false }
# Promoted to a direct dependency (already resolved transitively) so the
# isolated certificate-capture handshake in src/relay_cert.rs can build its
# own TlsConnector. Does not touch the `rustls = "0.23"` entry above or the
# `local-relay-tls` / `tokio-tungstenite` block below.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }

# Android-only dependencies
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
openssl = { version = "0.10", features = ["vendored"] }

# Whisper (with cross-platform acceleration features - excluded on Android)
[target.'cfg(all(not(target_os = "android"), target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.13.2", features = ["metal"], optional = true }

[target.'cfg(all(not(target_os = "android"), windows))'.dependencies]
whisper-rs = { version = "0.13.2", features = ["vulkan"], optional = true }

[target.'cfg(all(not(target_os = "android"), target_os = "linux"))'.dependencies]
whisper-rs = { version = "0.13.2", features = ["vulkan"], optional = true }

# For other platforms (not Android, macOS, Windows, or Linux)
[target.'cfg(all(not(target_os = "android"), not(target_os = "macos"), not(windows), not(target_os = "linux")))'.dependencies]
whisper-rs = { version = "0.13.2", optional = true }

# Desktop-only dependencies (deep link single-instance support)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.9.0"
tauri-plugin-single-instance = { version = "2.3.6", features = ["deep-link"] }
tauri-plugin-window-state = "2.4.1"
libc = "0.2"

# MCP bridge for AI-assisted debugging (only included in debug builds via cfg)
tauri-plugin-mcp-bridge = "0.12"

[dev-dependencies]
tauri = { version = "2.9.1", features = ["test"] }
# default-features = false + aws_lc_rs: rcgen's defaults enable `ring` explicitly,
# which this crate does not otherwise depend on for crypto.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
