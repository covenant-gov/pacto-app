name: Prepare Release

# Manual trigger only (Actions tab -> Prepare Release -> Run workflow). Bumps
# package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml / Cargo.lock,
# regenerates CHANGELOG.md, and opens a PR. Full frontend/Rust CI runs on that
# PR via ci.yaml (pull_request); this job does not rerun that suite.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # GHCR index digest of pacto-ci built from Dockerfile.ci at 431a95ff
      # (Ubuntu 24.04). :latest is mutable; replace this digest after a
      # verified ci-image.yaml rebuild.
      image: ghcr.io/covenant-gov/pacto-app/pacto-ci@sha256:31a21182f1cbb8146a1bd66ed855034bb106e10b7e7e926a127ae19a68b70e0f
      options: --user root
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      # Checkout records safe.directory in a temporary HOME. Later steps use
      # HOME=/github/home while this container runs as root against a
      # runner-owned mount. Trust only this checkout, persisted in that HOME.
      - name: Trust the workspace for git
        env:
          HOME: /github/home
        run: |
          mkdir -p "$HOME"
          ./scripts/trust-git-workspace.sh "$GITHUB_WORKSPACE"

      - name: install git-cliff
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2
        with:
          tool: git-cliff@2.14.2

      - name: Read previous version
        id: previous
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: bump version, changelog, lockfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bump-version.sh "${{ inputs.bump }}" --no-commit --skip-checks

      - name: read bumped version
        id: bumped
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Render release handoff
        env:
          VERSION: ${{ steps.bumped.outputs.version }}
          PREV_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          sed -e "s/{{VERSION}}/$VERSION/g" \
            -e "s|{{BRANCH}}|chore/release-$VERSION|g" \
            -e "s/{{PREV_VERSION}}/$PREV_VERSION/g" \
            -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
            .github/release-pr-handoff.md > "$RUNNER_TEMP/release-pr-body.md"

      - name: Ensure release notes labels exist
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            for (const [name, color, description] of [
              ['whats-new-ready', '0e8a16', 'User-facing release notes reviewed and ready'],
              ['whats-new-skip', 'ededed', 'Explicitly skip notes: no user-visible changes'],
            ]) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            }

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          sign-commits: true
          commit-message: "chore(release): bump version to ${{ steps.bumped.outputs.version }}"
          title: "chore(release): bump version to ${{ steps.bumped.outputs.version }}"
          body-path: ${{ runner.temp }}/release-pr-body.md
          branch: "chore/release-${{ steps.bumped.outputs.version }}"
          base: main
          delete-branch: true
