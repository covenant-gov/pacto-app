name: Prepare Release

# Manual trigger only (Actions tab -> Prepare Release -> Run workflow). Bumps
# package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml, regenerates
# CHANGELOG.md, runs the same checks scripts/bump-version.sh runs locally, and
# opens a PR with the result. Merging that PR to main runs tag-release.yaml,
# which pushes v<version> and dispatches release.yaml on that tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          # Same pin as ci.yaml. `lts/*` now resolves to Node 26, whose
          # experimental localStorage getter is undefined without
          # --localstorage-file and breaks jsdom Vitest.
          node-version: 24.18.0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          version: 11.7.0
          run_install: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable as of 2026-10-16

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: src-tauri

      - name: install git-cliff
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2
        with:
          tool: git-cliff@2.14.2

      - name: install Tauri system dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev file curl wget git pkg-config libvulkan-dev libxdo-dev libssl-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev xdg-utils glslc

      - name: Read previous version
        id: previous
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: bump version, changelog, checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/bump-version.sh "${{ inputs.bump }}" --no-commit

      - name: read bumped version
        id: bumped
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Render release handoff
        env:
          VERSION: ${{ steps.bumped.outputs.version }}
          PREV_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          sed -e "s/{{VERSION}}/$VERSION/g" \
            -e "s|{{BRANCH}}|chore/release-$VERSION|g" \
            -e "s/{{PREV_VERSION}}/$PREV_VERSION/g" \
            -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
            .github/release-pr-handoff.md > "$RUNNER_TEMP/release-pr-body.md"

      - name: Ensure release notes labels exist
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            for (const [name, color, description] of [
              ['whats-new-ready', '0e8a16', 'User-facing release notes reviewed and ready'],
              ['whats-new-skip', 'ededed', 'Explicitly skip notes: no user-visible changes'],
            ]) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            }

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          sign-commits: true
          commit-message: "chore(release): bump version to ${{ steps.bumped.outputs.version }}"
          title: "chore(release): bump version to ${{ steps.bumped.outputs.version }}"
          body-path: ${{ runner.temp }}/release-pr-body.md
          branch: "chore/release-${{ steps.bumped.outputs.version }}"
          base: main
          delete-branch: true
