name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check Tauri command wiring
        run: pnpm check:tauri-commands

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit types
        run: pnpm svelte-kit sync

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  e2e-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit types
        run: pnpm svelte-kit sync

      - name: Build agent SPA
        run: pnpm build:agent

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Run E2E smoke tests
        run: pnpm test:e2e

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ui-results
          path: test-results/
          if-no-files-found: ignore

  tauri-e2e:
    # Phase 2 real-Tauri harness. Builds the debug binary and drives it via the
    # Hypothesi MCP server. Requires a display (X11) and is sensitive to runner
    # setup, so it is marked continue-on-error until the environment is stable.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit types
        run: pnpm svelte-kit sync

      - name: Build frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev file curl wget git pkg-config libssl-dev libvulkan-dev glslc libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev xvfb dbus-x11

      - name: Build Tauri debug bundle
        run: xvfb-run --auto-servernum pnpm tauri build --debug --no-bundle --ci

      - name: Run real-Tauri e2e harness
        env:
          PACTO_TAURI_BINARY: src-tauri/target/debug/pacto
        # GTK/WebKitGTK probe the AT-SPI accessibility bus on startup; without a
        # real session bus (no desktop session on the runner) that probe can hang
        # indefinitely before the binary executes a single line of `run()`,
        # which is what a plain `xvfb-run` invocation was silently doing here.
        # `dbus-run-session` gives it a real bus to talk to.
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm test:e2e:tauri

      - name: Upload Tauri e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-e2e-results
          path: test-results/
          if-no-files-found: ignore

  backend-tests:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/covenant-gov/pacto-app/pacto-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib --no-default-features

  relay-free-harness:
    # Relay-free seeding harness: builds populated per-account storage with
    # zero network calls, through the real ingest path.
    # No dev-env docker-compose stack. The harness binary alone runs inside
    # `unshare --net` so checkout / rust-cache / apt keep network, while the
    # seed itself has an empty network namespace. This is an honest-binary
    # smoke test (the PR-built binary is not adversarially sandboxed).
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/covenant-gov/pacto-app/pacto-ci:latest
      options: --user root --cap-add=SYS_ADMIN
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Harness unit tests
        working-directory: src-tauri
        # Quoted: the trailing `::` module filter would otherwise read as a
        # YAML mapping key and make this whole file unparseable.
        run: "cargo test --lib --no-default-features --features relay-free-harness harness::"

      - name: Build relay-free harness
        working-directory: src-tauri
        run: cargo build --no-default-features --features relay-free-harness --bin relay-free-harness

      - name: Install sqlite3
        run: apt-get update -qq && apt-get install -y -qq sqlite3

      - name: Seed a sandbox with no network namespace
        working-directory: src-tauri
        # The CI image's default shell is dash, which has no `pipefail`, so
        # redirect rather than pipe -- `set -e` then still fails the step on a
        # non-zero harness exit instead of only on a failed `grep`.
        # Root must sit under test_sandbox/ (harness placement check).
        run: |
          set -eu
          SANDBOX_ROOT="$GITHUB_WORKSPACE/test_sandbox/relay-free-harness-ci"
          mkdir -p "$SANDBOX_ROOT"
          unshare --net -- ./target/debug/relay-free-harness \
            --sandbox-root "$SANDBOX_ROOT" \
            > /tmp/harness-first-run.log 2>&1
          cat /tmp/harness-first-run.log
          grep -q "Seeded npub=" /tmp/harness-first-run.log
          grep -q "dm_messages=2" /tmp/harness-first-run.log
          grep -E -q 'squad_group_id=Some\("[^"]+"\)' /tmp/harness-first-run.log
          # sqlite3-assert the counts already documented in the PR body.
          ACCOUNT_DB=$(find "$SANDBOX_ROOT" -name 'pacto.db' | head -n 1)
          test -n "$ACCOUNT_DB"
          test "$(sqlite3 "$ACCOUNT_DB" 'SELECT COUNT(*) FROM events;')" -eq 6
          test "$(sqlite3 "$ACCOUNT_DB" 'SELECT COUNT(*) FROM chats;')" -eq 2
          test "$(sqlite3 "$ACCOUNT_DB" 'SELECT COUNT(*) FROM mls_groups;')" -eq 1
          test "$(sqlite3 "$ACCOUNT_DB" 'SELECT COUNT(*) FROM evm_accounts;')" -eq 1

      - name: Rerun is idempotent, still with no network namespace
        working-directory: src-tauri
        run: |
          set -eu
          SANDBOX_ROOT="$GITHUB_WORKSPACE/test_sandbox/relay-free-harness-ci"
          unshare --net -- ./target/debug/relay-free-harness \
            --sandbox-root "$SANDBOX_ROOT" \
            > /tmp/harness-second-run.log 2>&1
          cat /tmp/harness-second-run.log
          grep -q "already seeded" /tmp/harness-second-run.log

  landing-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit types
        run: pnpm svelte-kit sync

      - name: Build landing site
        run: pnpm --filter pacto-landing build

  release-symbol-check:
    # Ensure the release binary does not contain debug-only test-auth or
    # MCP-bridge symbols. This job is intentionally separate from the debug
    # backend-tests because it builds --release and is slower.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/covenant-gov/pacto-app/pacto-ci:latest
      options: --user root
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check release binary symbols
        run: ./scripts/check-release-symbols.sh

  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.18.0

      - name: Run release script tests
        run: node --test scripts/generate-release-manifest.test.mjs scripts/stamp-updater-compatibility.test.mjs

