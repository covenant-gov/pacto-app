name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  release-notes:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest

      - name: Write release body
        id: notes
        env:
          CHANGELOG: ${{ steps.changelog.outputs.content }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          {
            printf '%s\n' "$CHANGELOG"
            sed -e "s/{{TAG}}/$TAG/g" -e "s/{{VERSION}}/$VERSION/g" .github/release-install-notes.md
          } > release-body.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-body.md
          retention-days: 1

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md

      - name: Upload CHANGELOG
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 1

  publish-tauri:
    needs: release-notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: '--target x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-24.04-arm'
            args: '--target aarch64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes

      - name: Download changelog
        uses: actions/download-artifact@v7
        with:
          name: changelog

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          body=$(cat release-body.md)
          delimiter="RELEASE_NOTES_EOF_${{ github.run_id }}"
          echo "body<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Targets are used on macOS runners (both architectures) and the Linux arm64 native runner.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.args == '--target aarch64-unknown-linux-gnu' && 'aarch64-unknown-linux-gnu' || '') }}

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev file curl wget git pkg-config libvulkan-dev libxdo-dev libssl-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev xdg-utils
          # whisper-rs/ggml-vulkan needs glslc. LunarG's vulkan-sdk is only published for amd64,
          # so on arm64 runners install glslc from Ubuntu's own repositories.
          if [ "$(uname -m)" = "aarch64" ]; then
            sudo apt-get install -y glslc
          else
            # Install Vulkan SDK with glslc compiler
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk
          fi

      - name: Install Vulkan SDK and OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          Write-Host "Installing Vulkan components..."

          # Install Vulkan components via vcpkg
          vcpkg install vulkan:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows spirv-tools:x64-windows

          # Install OpenSSL for sqlcipher support
          Write-Host "Installing OpenSSL..."
          vcpkg install openssl:x64-windows-static

          # Download glslc from your server
          Write-Host "Downloading glslc.exe..."
          Invoke-WebRequest -Uri "https://jskitty.cat/glslc.exe" -OutFile "glslc.exe"

          # Place it in the vcpkg bin directory
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          New-Item -ItemType Directory -Force -Path $vcpkgBin
          Move-Item "glslc.exe" "$vcpkgBin\glslc.exe" -Force

          # Set up environment
          echo "VULKAN_SDK=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$vcpkgBin" >> $env:GITHUB_PATH

          # Set OpenSSL environment for sqlcipher
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

          # Verify glslc works
          Write-Host "Verifying glslc..."
          & "$vcpkgBin\glslc.exe" --version

      - name: Shorten cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:\cargo-target" >> $env:GITHUB_ENV

      - name: install frontend dependencies
        env:
          VITE_COMMIT_HASH: ${{ github.sha }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_COMMIT_HASH: ${{ github.sha }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          COPYFILE_DISABLE: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pacto ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          retryAttempts: 3
          uploadWorkflowArtifacts: true

      - name: Upload CHANGELOG to release
        if: matrix.platform == 'ubuntu-24.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" CHANGELOG.md --clobber

  update-homebrew-tap:
    # Points covenant-gov/homebrew-pacto's Cask at the DMGs just published above.
    # Requires HOMEBREW_TAP_TOKEN: a PAT (or fine-grained token) with contents:write
    # on homebrew-pacto, since GITHUB_TOKEN here only covers this repo.
    needs: publish-tauri
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout homebrew-pacto
        uses: actions/checkout@v6
        with:
          repository: covenant-gov/homebrew-pacto
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-pacto

      - name: Download macOS release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo covenant-gov/pacto-app \
            --pattern 'Pacto_*_aarch64.dmg' --pattern 'Pacto_*_x64.dmg' --dir dmgs

      - name: Update Cask
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          ARM_SHA="$(sha256sum "dmgs/Pacto_${VERSION}_aarch64.dmg" | cut -d' ' -f1)"
          INTEL_SHA="$(sha256sum "dmgs/Pacto_${VERSION}_x64.dmg" | cut -d' ' -f1)"
          CASK=homebrew-pacto/Casks/pacto.rb
          sed -i \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 arm:   \".*\"/  sha256 arm:   \"${ARM_SHA}\"/" \
            -e "s/^         intel: \".*\"/         intel: \"${INTEL_SHA}\"/" \
            -e 's|/pacto_#{version}_#{arch}\.dmg|/Pacto_#{version}_#{arch}.dmg|' \
            "$CASK"
          cat "$CASK"

      - name: Open PR against homebrew-pacto
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-pacto
          commit-message: "chore: bump cask to ${{ github.ref_name }}"
          title: "chore: bump cask to ${{ github.ref_name }}"
          body: |
            Automated from covenant-gov/pacto-app's `${{ github.ref_name }}` release publish.
          branch: "chore/bump-${{ github.ref_name }}"
          base: main
          delete-branch: true
