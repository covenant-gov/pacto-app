name: 'publish'

# Tag Release dispatches this on the new tag. A GITHUB_TOKEN tag push
# does not start the push trigger.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default read-only. Jobs that create releases, upload assets, or open the
# Homebrew tap PR raise permissions explicitly. Signing / tap tokens stay on
# the steps that need them — never on pnpm install.
permissions:
  contents: read

# One publish per ref. A second run waits; cancelling would interrupt uploads.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-notes:
    runs-on: ubuntu-24.04
    # Changelog entries look up PR authors and the issues each PR closes.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Require a v* tag ref
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "publish must run on a v* tag ref, got $GITHUB_REF"
          exit 1

      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2
        with:
          tool: git-cliff@2.14.2

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/changelog.mjs --latest --output release-changelog.md

      - name: Write release body
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          {
            cat release-changelog.md
            sed -e "s/{{TAG}}/$TAG/g" -e "s/{{VERSION}}/$VERSION/g" .github/release-install-notes.md
          } > release-body.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-notes
          path: release-body.md
          retention-days: 1

      - name: Generate CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/changelog.mjs --output CHANGELOG.md
          ./scripts/post-process-changelog.sh

      - name: Upload CHANGELOG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 1

  publish-tauri:
    needs: release-notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # oldest LTS providing libwebkit2gtk-4.1-dev; avoids a newer-webkit2gtk EGL/Wayland init bug on non-Ubuntu compositors and maximizes glibc compat for the AppImage/deb.
            args: '--target x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-24.04-arm' # stays on Noble: Ubuntu's own glslc/shaderc apt package (needed by whisper-rs/ggml-vulkan on arm64, where LunarG's SDK isn't published) only exists from 24.04 onward.
            args: '--target aarch64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Download release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: release-notes

      - name: Download changelog
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: changelog

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          body=$(cat release-body.md)
          delimiter="RELEASE_NOTES_EOF_${{ github.run_id }}"
          echo "body<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: lts/*

      - name: setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          version: 11.7.0
          run_install: false

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable as of 2026-10-16
        with:
          # Targets are used on macOS runners (both architectures) and the Linux arm64 native runner.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.args == '--target aarch64-unknown-linux-gnu' && 'aarch64-unknown-linux-gnu' || '') }}

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev file curl wget git pkg-config libvulkan-dev libxdo-dev libssl-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libasound2-dev xdg-utils
          # whisper-rs/ggml-vulkan needs glslc. LunarG's vulkan-sdk is only published for amd64,
          # so on arm64 runners install glslc from Ubuntu's own repositories.
          if [ "$(uname -m)" = "aarch64" ]; then
            sudo apt-get install -y glslc
          else
            # Install Vulkan SDK with glslc compiler
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update
            sudo apt-get install -y vulkan-sdk
          fi

      - name: Install Vulkan SDK and OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          Write-Host "Installing Vulkan components..."

          # Install Vulkan components via vcpkg
          vcpkg install vulkan:x64-windows vulkan-headers:x64-windows vulkan-loader:x64-windows spirv-tools:x64-windows

          # Install OpenSSL for sqlcipher support
          Write-Host "Installing OpenSSL..."
          vcpkg install openssl:x64-windows-static

          # Download glslc from your server
          Write-Host "Downloading glslc.exe..."
          Invoke-WebRequest -Uri "https://jskitty.cat/glslc.exe" -OutFile "glslc.exe"

          # Place it in the vcpkg bin directory
          $vcpkgBin = "C:\vcpkg\installed\x64-windows\bin"
          New-Item -ItemType Directory -Force -Path $vcpkgBin
          Move-Item "glslc.exe" "$vcpkgBin\glslc.exe" -Force

          # Set up environment
          echo "VULKAN_SDK=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\vcpkg\installed\x64-windows" >> $env:GITHUB_ENV
          echo "$vcpkgBin" >> $env:GITHUB_PATH

          # Set OpenSSL environment for sqlcipher
          echo "OPENSSL_DIR=C:\vcpkg\installed\x64-windows-static" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

          # Verify glslc works
          Write-Host "Verifying glslc..."
          & "$vcpkgBin\glslc.exe" --version

      - name: Shorten cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:\cargo-target" >> $env:GITHUB_ENV

      # Install without signing / tap secrets in the environment. Package
      # lifecycle scripts are limited by pnpm-workspace.yaml allowBuilds.
      - name: install frontend dependencies
        env:
          VITE_COMMIT_HASH: ${{ github.sha }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_COMMIT_HASH: ${{ github.sha }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          COPYFILE_DISABLE: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pacto ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          # Stay draft until every matrix leg and stamp-updater-compatibility
          # finish; publish-github-release undrafts once latest.json is complete.
          releaseDraft: true
          # Tags with a semver prerelease suffix (vX.Y.Z-beta.N) stay off GitHub "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          retryAttempts: 3
          uploadWorkflowArtifacts: true

      - name: Upload CHANGELOG to release
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" CHANGELOG.md --clobber

  stamp-updater-compatibility:
    # Stamps the tracked minimum_compatible_version onto the draft release's
    # latest.json so the in-app update gate can enforce it. See
    # scripts/release-compatibility.json and release-compatibility.yaml for
    # the correction path when the tracked value needs to change.
    needs: publish-tauri
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: lts/*

      - name: Stamp updater compatibility manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/stamp-updater-compatibility.mjs

  publish-github-release:
    # Atomic publish: undraft only after latest.json has every matrix platform
    # and minimum_compatible_version. Until then releases/latest still serves
    # the previous complete release.
    needs: stamp-updater-compatibility
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: lts/*

      - name: Verify latest.json and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-github-release.mjs

  update-homebrew-tap:
    # Points covenant-gov/homebrew-pacto's Cask at the DMGs just published above,
    # then waits for the tap's own release-bump workflow to verify and merge that
    # PR. The job is green only once brew users can actually get this version.
    # Requires HOMEBREW_TAP_TOKEN: a PAT (or fine-grained token) with
    # contents:write and pull-requests:write on homebrew-pacto, since
    # GITHUB_TOKEN here only covers this repo.
    # Betas (vX.Y.Z-*) must not move the cask; brew users stay on latest stable.
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish-github-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout pacto-app
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          path: pacto-app

      - name: Checkout homebrew-pacto
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
          repository: covenant-gov/homebrew-pacto
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-pacto

      - name: Close superseded cask bump PRs
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: pacto-app/scripts/close-stale-tap-bump-prs.sh "$TAG"

      - name: Download macOS release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo covenant-gov/pacto-app \
            --pattern 'Pacto_*_aarch64.dmg' --pattern 'Pacto_*_x64.dmg' --dir dmgs

      - name: Update Cask
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          ARM_SHA="$(sha256sum "dmgs/Pacto_${VERSION}_aarch64.dmg" | cut -d' ' -f1)"
          INTEL_SHA="$(sha256sum "dmgs/Pacto_${VERSION}_x64.dmg" | cut -d' ' -f1)"
          CASK=homebrew-pacto/Casks/pacto.rb
          sed -i \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 arm:   \".*\"/  sha256 arm:   \"${ARM_SHA}\"/" \
            -e "s/^         intel: \".*\"/         intel: \"${INTEL_SHA}\"/" \
            -e 's|/pacto_#{version}_#{arch}\.dmg|/Pacto_#{version}_#{arch}.dmg|' \
            "$CASK"
          cat "$CASK"

      - name: Open PR against homebrew-pacto
        id: tap_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          sign-commits: true
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-pacto
          commit-message: "chore: bump cask to ${{ github.ref_name }}"
          title: "chore: bump cask to ${{ github.ref_name }}"
          body: |
            Automated from covenant-gov/pacto-app's `${{ github.ref_name }}` release publish.

            `release-bump.yaml` verifies the cask and merges this PR; no human step.
          branch: "chore/bump-${{ github.ref_name }}"
          base: main
          delete-branch: true

      - name: Confirm the tap already carries this version
        if: steps.tap_pr.outputs.pull-request-number == ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! grep -q "^  version \"${VERSION}\"$" homebrew-pacto/Casks/pacto.rb; then
            echo "No bump PR was opened and the tap's cask is not at ${VERSION}."
            exit 1
          fi
          echo "Cask already at ${VERSION}; nothing to merge."

      - name: Wait for the tap to verify and merge the bump
        id: tap_merge
        if: steps.tap_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: pacto-app/scripts/wait-for-tap-pr-merge.sh "${{ steps.tap_pr.outputs.pull-request-number }}"

      - name: Open an issue when the tap was not updated
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PR_URL: ${{ steps.tap_merge.outputs.pr_url }}
          TAP_RUN_URL: ${{ steps.tap_merge.outputs.run_url }}
          REASON: ${{ steps.tap_merge.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "\`update-homebrew-tap\` finished red for \`$TAG\`, so \`brew install --cask covenant-gov/pacto/pacto\` still serves the previous version."
            echo
            echo "- Reason: ${REASON:-the job failed before the merge wait; see the run log}"
            echo "- Tap PR: ${PR_URL:-none opened}"
            echo "- Tap check: ${TAP_RUN_URL:-none}"
            echo "- Release run: $RUN_URL"
            echo
            echo "Fix the cask or the failing gate, then re-run this job."
          } > issue-body.md
          gh issue create --repo covenant-gov/pacto-app \
            --title "Homebrew tap not updated for $TAG" \
            --label ci/cd \
            --body-file issue-body.md

  deploy-landing:
    # Refreshes the public download page for the tag just published.
    #
    # Chained here rather than left to deploy-landing.yaml's own
    # `release: published` listener: the release is undrafted with
    # GITHUB_TOKEN, and GITHUB_TOKEN-authenticated runs do not reliably trigger
    # other workflows' release events. That gap left the site on v0.5.1 through
    # two releases (#213). `needs: publish-github-release` also guarantees the
    # draft stayed private until every platform and the stamped latest.json
    # were verified, so the download page never lists a partial asset set.
    # Skip prerelease tags so the public download page stays on latest stable.
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish-github-release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-landing.yaml
    with:
      release_tag: ${{ github.ref_name }}
